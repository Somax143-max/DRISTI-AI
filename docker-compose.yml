version: '3.8'

services:
  drishti-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drishti-ai-screening-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DRISHTI_ENV=production
      - DRISHTI_PORT=8080
      - DRISHTI_LOG_LEVEL=INFO
      - RURAL_EDGE_MODE=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
